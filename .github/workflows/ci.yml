name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - '*.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check formatting
        run: npx prettier --check .

      - name: Build (type-check)
        run: npm run prepare

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --audit-level=high

  build:
    name: Test (${{ matrix.node-version }}, ${{ matrix.platform.os }}, ${{ matrix.platform.shell }})
    needs: lint
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
        platform:
        - os: ubuntu-latest
          shell: bash
        - os: macos-latest
          shell: bash
        - os: windows-latest
          shell: bash
        - os: windows-latest
          shell: powershell
      fail-fast: false

    runs-on: ${{ matrix.platform.os }}
    defaults:
      run:
        shell: ${{ matrix.platform.shell }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run Tests Windows (incomplete coverage)
        if: matrix.platform.os == 'windows-latest'
        run: npm test -- -c -t0 --allow-incomplete-coverage

      - name: Run Tests Unix (complete coverage)
        if: matrix.platform.os != 'windows-latest'
        run: npm test -- -c -t0

      - name: Upload coverage report
        if: >
          matrix.platform.os == 'ubuntu-latest' &&
          matrix.node-version == '22.x' &&
          matrix.platform.shell == 'bash'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
